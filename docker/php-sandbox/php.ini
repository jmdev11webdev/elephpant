; Hardened PHP 8.5 sandbox runtime configuration for elePHPant
disable_functions = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec,curl_exec,curl_multi_exec,parse_ini_file,show_source,file_put_contents,unlink,rmdir,mkdir,chmod,chown
memory_limit = 32M
max_execution_time = 3
display_errors = 1
display_startup_errors = 1
error_reporting = E_ALL
allow_url_fopen = 0
allow_url_include = 0
expose_php = 0
